[toolchain]
anchor_version = "0.32.1"

[features]
resolution = true
skip-lint = false

[workspace]
members = ["programs/*"]

[programs.localnet]
local_bridge = "4zNJzVfMcFQsYWR62i6akHQXKB1t1YatSJtcJVHdbLt2"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 10000
